name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kinvo
          POSTGRES_PASSWORD: kinvo
          POSTGRES_DB: kinvo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kinvo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      PORT: 4000
      DATABASE_URL: postgresql://kinvo:kinvo@localhost:5432/kinvo_test
      REDIS_URL: redis://localhost:6379
      CORS_ORIGIN: http://localhost:5173
      LOG_LEVEL: silent

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.3

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Prisma schema validate
        run: pnpm --filter @kinvo/api run prisma:validate

      - name: Dependency vulnerability audit
        run: pnpm audit --audit-level=high

      - name: Test
        run: pnpm run test

      - name: Build
        run: pnpm run build

  secret-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
